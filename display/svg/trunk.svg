<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Trunk cylinder body -->
  <rect x="40" y="0" width="40" height="80" fill="#aab4be"/>

  <!-- Structural ribs -->
  <line x1="40" y1="26" x2="80" y2="26" stroke="#8899aa" stroke-width="1.5"/>
  <line x1="40" y1="52" x2="80" y2="52" stroke="#8899aa" stroke-width="1.5"/>

  <!-- Solar array left -->
  <rect x="2" y="18" width="38" height="44" rx="2" fill="#1a3f7a"/>
  <!-- Solar cell grid left -->
  <line x1="2"  y1="29" x2="40" y2="29" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="2"  y1="40" x2="40" y2="40" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="2"  y1="51" x2="40" y2="51" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="15" y1="18" x2="15" y2="62" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="28" y1="18" x2="28" y2="62" stroke="#2255aa" stroke-width="0.8"/>

  <!-- Solar array right -->
  <rect x="80" y="18" width="38" height="44" rx="2" fill="#1a3f7a"/>
  <!-- Solar cell grid right -->
  <line x1="80"  y1="29" x2="118" y2="29" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="80"  y1="40" x2="118" y2="40" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="80"  y1="51" x2="118" y2="51" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="93"  y1="18" x2="93"  y2="62" stroke="#2255aa" stroke-width="0.8"/>
  <line x1="106" y1="18" x2="106" y2="62" stroke="#2255aa" stroke-width="0.8"/>

  <!-- Panel deployment hinges -->
  <rect x="37" y="28" width="6" height="24" rx="1" fill="#667788"/>
  <rect x="77" y="28" width="6" height="24" rx="1" fill="#667788"/>
</svg>
