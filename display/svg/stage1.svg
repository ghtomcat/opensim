<svg viewBox="0 0 60 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Interstage collar (top) -->
  <rect x="16" y="0" width="28" height="14" rx="2" fill="#8899aa"/>

  <!-- Main body -->
  <rect x="20" y="14" width="20" height="210" fill="#c8d0da"/>

  <!-- Horizontal weld lines (tank separation) -->
  <line x1="20" y1="80"  x2="40" y2="80"  stroke="#aab4be" stroke-width="1.5"/>
  <line x1="20" y1="160" x2="40" y2="160" stroke="#aab4be" stroke-width="1.5"/>

  <!-- Grid fins (left + right, near top) -->
  <rect x="4"  y="20" width="16" height="12" rx="1" fill="#7788aa"/>
  <rect x="40" y="20" width="16" height="12" rx="1" fill="#7788aa"/>
  <!-- Grid fin crosshatch suggestion -->
  <line x1="8"  y1="20" x2="8"  y2="32" stroke="#667799" stroke-width="1"/>
  <line x1="12" y1="20" x2="12" y2="32" stroke="#667799" stroke-width="1"/>
  <line x1="44" y1="20" x2="44" y2="32" stroke="#667799" stroke-width="1"/>
  <line x1="48" y1="20" x2="48" y2="32" stroke="#667799" stroke-width="1"/>

  <!-- Engine section / octaweb base -->
  <rect x="18" y="224" width="24" height="18" rx="1" fill="#aab4be"/>

  <!-- 9 Merlin engine bells (side view — 3 visible, slightly fanned) -->
  <path d="M19 242 L15 278 L22 278 Z" fill="#556677"/>
  <path d="M27 242 L24 278 L31 278 Z" fill="#556677"/>
  <path d="M35 242 L30 278 L37 278 Z" fill="#556677"/>
  <!-- Engine glow -->
  <ellipse cx="18.5" cy="278" rx="3.5" ry="2" fill="rgba(255,180,60,0.35)"/>
  <ellipse cx="27.5" cy="278" rx="3.5" ry="2" fill="rgba(255,180,60,0.35)"/>
  <ellipse cx="33.5" cy="278" rx="3.5" ry="2" fill="rgba(255,180,60,0.35)"/>

  <!-- Landing legs (2 shown) -->
  <line x1="20" y1="230" x2="4"  y2="320" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="230" x2="56" y2="320" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Foot pads -->
  <line x1="1"  y1="320" x2="11" y2="320" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49" y1="320" x2="59" y2="320" stroke="#8899aa" stroke-width="2.5" stroke-linecap="round"/>
</svg>
